{% extends "base.html" %}
{% load static %}

{% block title %}New Order - THERESE{% endblock %}

{% block content %}
<div class="page-header">
    <h1>New Order</h1>
</div>

<div class="card">
    <p style="font-size: 1.1rem; margin-bottom: 2rem;">
        Please choose the type of order you want to create:
    </p>

    <div class="task-type-grid">
        <a href="{% url 'tasks:task_create' %}?type=purchase_order" class="task-type-card">
            <i class="fas fa-shopping-cart fa-3x"></i>
            <h3>New Purchase Order</h3>
            <p>Order items from a supplier</p>
        </a>

        <a href="{% url 'tasks:task_create' %}?type=purchase_order&amp;variant=quote" class="task-type-card">
            <i class="fas fa-file-pdf fa-3x"></i>
            <h3>Order with Quote</h3>
            <p>Attach a quote and order from it</p>
        </a>
    </div>
</div>
{% endblock %}
