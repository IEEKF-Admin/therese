{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - THERESE</title>
    <link rel="stylesheet" href="{% static 'css/therese.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body.login-page {
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
        }
        .login-module {
            max-width: 480px;
            margin: 80px auto;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        .login-logo {
            max-height: 160px;
            width: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
        }
        .login-module h1 {
            color: #1e40af;
            font-size: 2.6rem;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        .login-module .subtitle {
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.45;
            margin-bottom: 32px;
        }
        .login-module .form-group {
            margin-bottom: 22px;
            text-align: left;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        .login-module .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #1e2937;
            font-size: 1rem;
        }
        .login-module input[type="text"],
        .login-module input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.05rem;
            background: #f1f5f9;
            color: #1e2937;
            box-sizing: border-box;
        }
        .login-module button[type="submit"] {
            width: 100%;
            max-width: 340px;
            padding: 14px 16px;
            font-size: 1.15rem;
            font-weight: 600;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px auto 0;
            display: block;
        }
        .login-module button[type="submit"]:hover {
            background: #1d4ed8;
        }
        .login-module .errorlist {
            color: #ef4444;
            background: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body class="login-page">
<div class="login-module">
    <img src="{% static 'images/logo_no_background.webp' %}"
         alt="THERESE Logo"
         class="login-logo">

    <h1>THERESE</h1>
    <p class="subtitle therese-tagline">{% include "includes/therese_tagline.html" %}</p>

    <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}

        {% if form.errors %}
            <div class="errorlist">
                {% for error in form.non_field_errors %}{{ error }}{% endfor %}
            </div>
        {% endif %}

        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
        </div>

        <input type="hidden" name="next" value="{{ next|default:'/tasks/' }}">

        <button type="submit">Login</button>
    </form>

    <p style="margin-top: 28px; color: #64748b; font-size: 0.97rem;">
        No access yet? Please contact IT support.
    </p>
</div>
</body>
</html>
