<table class="table">
    <thead>
        <tr>
            <th><input type="checkbox" data-check-all></th>
            <th>Employee</th>
            <th>From</th>
            <th>Until</th>
            <th>Days</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td><input type="checkbox" name="request_id" value="{{ item.pk }}"></td>
            <td>{{ item.employee.get_full_name }}</td>
            <td>{{ item.start_date|date:"d.m.Y" }}</td>
            <td>{{ item.end_date|date:"d.m.Y" }}</td>
            <td>{{ item.day_count }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="5" class="empty-state">No pending requests.</td></tr>
        {% endfor %}
    </tbody>
</table>
<script>
document.querySelectorAll('[data-check-all]').forEach(function(master) {
    master.addEventListener('change', function() {
        var table = master.closest('table');
        table.querySelectorAll('input[name="request_id"]').forEach(function(box) {
            box.checked = master.checked;
        });
    });
});
</script>
