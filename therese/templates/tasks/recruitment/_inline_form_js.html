<script>
(function() {
    function replacePrefix(str, newIndex) {
        return str.replace(/__prefix__/g, newIndex);
    }

    function getTotalFormsInput(container) {
        let input = container.querySelector('input[name$="-TOTAL_FORMS"]');
        if (input) return input;
        let sibling = container.previousElementSibling;
        while (sibling) {
            input = sibling.querySelector && sibling.querySelector('input[name$="-TOTAL_FORMS"]');
            if (input) return input;
            sibling = sibling.previousElementSibling;
        }
        const parent = container.parentElement;
        if (parent) {
            input = parent.querySelector('input[name$="-TOTAL_FORMS"]');
            if (input) return input;
        }
        const all = document.querySelectorAll('input[name$="-TOTAL_FORMS"]');
        return all.length ? all[0] : null;
    }

    window.addInlineRow = function(containerId, templateSelector, formsetPrefix) {
        const container = document.getElementById(containerId);
        if (!container) return;

        let template = document.getElementById('recruitment-funding-empty-template');
        if (!template) {
            template = container.querySelector('.empty-form-template');
        }
        if (!template) {
            template = container.querySelector(templateSelector);
        }
        if (!template) return;

        const totalInput = getTotalFormsInput(container);
        let newIndex = totalInput ? (parseInt(totalInput.value, 10) || 0) : 0;

        const clone = template.cloneNode(true);
        clone.classList.remove('empty-form-template');
        clone.style.display = '';
        clone.id = '';

        clone.querySelectorAll('[name],[id],[for]').forEach(el => {
            ['name', 'id', 'for'].forEach(attr => {
                if (el.hasAttribute(attr)) {
                    el.setAttribute(attr, el.getAttribute(attr).replace(/__prefix__/g, newIndex));
                }
            });
        });

        clone.querySelectorAll('input, select, textarea').forEach(el => {
            el.disabled = false;
            el.removeAttribute('required');
            if (el.type === 'hidden') {
                if (/-id$/.test(el.name) || /-recruitment_task$/.test(el.name)) {
                    el.value = '';
                }
                return;
            }
            if (el.type === 'checkbox' || el.type === 'radio') {
                el.checked = false;
            } else {
                el.value = '';
            }
        });

        container.appendChild(clone.firstElementChild || clone);
        if (totalInput) {
            totalInput.value = newIndex + 1;
        }
        if (typeof window.syncFundingPercentageColumns === 'function') {
            window.syncFundingPercentageColumns();
        }
        if (typeof initFieldCopyButtons === 'function') {
            initFieldCopyButtons();
        }
    };

    window.syncFundingPercentageColumns = function() {
        document.querySelectorAll('.funding-percentage-container').forEach(function(container) {
            const rows = Array.prototype.filter.call(
                container.querySelectorAll('.funding-row'),
                function(row) {
                    if (row.closest('.empty-form-template')) return false;
                    if (row.style.display === 'none') return false;
                    return true;
                }
            );
            const show = rows.length > 1;
            container.classList.toggle('funding-show-percentage', show);
            rows.forEach(function(row) {
                const input = row.querySelector('[name$="-workhours_percentage"]');
                if (!input) return;
                if (!show) {
                    input.value = '100';
                } else if (!String(input.value || '').trim()) {
                    input.value = '';
                }
            });
        });
    };

    document.addEventListener('click', function(e) {
        const removeBtn = e.target.closest('.remove-row');
        if (!removeBtn) return;
        const row = removeBtn.closest('.inline-form-row, .funding-row, .recruitment-funding-row');
        if (!row) return;
        const deleteCheckbox = row.querySelector('input[name$="-DELETE"]');
        if (deleteCheckbox) {
            deleteCheckbox.checked = true;
            row.style.display = 'none';
        } else {
            row.remove();
        }
        if (typeof window.syncFundingPercentageColumns === 'function') {
            window.syncFundingPercentageColumns();
        }
    });

    function fieldCopyText(field) {
        const input = field.querySelector('input:not([type="hidden"]):not([type="file"]):not([type="checkbox"]):not([type="radio"]), select, textarea');
        if (input) {
            if (input.tagName === 'SELECT') {
                const opt = input.options[input.selectedIndex];
                return opt ? String(opt.text || '').trim() : '';
            }
            return String(input.value || '').trim();
        }
        const ro = field.querySelector('.form-readonly, .recruitment-costs-value');
        if (ro) return String(ro.innerText || '').replace(/\s+/g, ' ').trim();
        return '';
    }

    function isCopyableText(text) {
        if (!text) return false;
        if (text === '—' || text === '---------') return false;
        if (text.indexOf('Select') === 0 || text.indexOf('— Select') === 0) return false;
        return true;
    }

    function addCopyButton(field) {
        if (field.closest('.empty-form-template')) return;
        if (field.querySelector('.btn-copy-field')) return;
        if (field.querySelector('input[type="file"]')) return;
        const control = field.querySelector(
            'input:not([type="hidden"]):not([type="file"]):not([type="checkbox"]):not([type="radio"]), select, textarea, .form-readonly, .recruitment-costs-box'
        );
        if (!control) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-copy-field';
        btn.title = 'Copy';
        btn.setAttribute('aria-label', 'Copy');
        btn.innerHTML = '<i class="fas fa-copy" aria-hidden="true"></i>';
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const text = fieldCopyText(field);
            if (!isCopyableText(text) || !navigator.clipboard) return;
            navigator.clipboard.writeText(text).then(function() {
                btn.classList.add('is-copied');
                btn.title = 'Copied';
                setTimeout(function() {
                    btn.classList.remove('is-copied');
                    btn.title = 'Copy';
                }, 1200);
            });
        });
        const wrap = document.createElement('div');
        wrap.className = 'recruitment-field-control';
        control.parentNode.insertBefore(wrap, control);
        wrap.appendChild(control);
        wrap.appendChild(btn);
    }

    function initFieldCopyButtons(root) {
        const scopes = root
            ? (root.matches && root.matches('[data-show-copy="1"]') ? [root] : root.querySelectorAll('[data-show-copy="1"]'))
            : document.querySelectorAll('[data-show-copy="1"]');
        scopes.forEach(function(scope) {
            scope.querySelectorAll('.recruitment-field').forEach(addCopyButton);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (typeof window.syncFundingPercentageColumns === 'function') {
            window.syncFundingPercentageColumns();
        }
        initFieldCopyButtons();
    });
})();
</script>
