<script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof tinymce === 'undefined') return;

    const uploadUrl = window.DOCUMENT_EDITOR_IMAGE_UPLOAD_URL || '';
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';

    const editorConfig = {
        selector: 'textarea.wysiwyg-editor',
        license_key: 'gpl',
        height: 520,
        width: '100%',
        menubar: 'edit insert view format table',
        plugins: 'lists advlist link autolink table code image charmap searchreplace visualblocks wordcount preview',
        toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | forecolor backcolor | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image table charmap hr | removeformat | code preview',
        promotion: false,
        paste_data_images: true,
        image_title: true,
        automatic_uploads: true,
        font_size_formats: '10pt 11pt 12pt 14pt 16pt 18pt 24pt',
        content_style: 'body { font-family: Inter, Arial, sans-serif; font-size: 14px; }',
    };

    if (uploadUrl && csrfToken) {
        editorConfig.images_upload_handler = function(blobInfo, progress) {
            return new Promise(function(resolve, reject) {
                const formData = new FormData();
                formData.append('file', blobInfo.blob(), blobInfo.filename());

                const xhr = new XMLHttpRequest();
                xhr.open('POST', uploadUrl);
                xhr.setRequestHeader('X-CSRFToken', csrfToken);
                xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

                xhr.upload.onprogress = function(event) {
                    if (event.lengthComputable) {
                        progress(event.loaded / event.total * 100);
                    }
                };

                xhr.onload = function() {
                    if (xhr.status < 200 || xhr.status >= 300) {
                        reject('Image upload failed (' + xhr.status + ').');
                        return;
                    }
                    try {
                        const json = JSON.parse(xhr.responseText);
                        if (!json.location) {
                            reject(json.error || 'Invalid upload response.');
                            return;
                        }
                        resolve(json.location);
                    } catch (error) {
                        reject('Invalid upload response.');
                    }
                };

                xhr.onerror = function() {
                    reject('Image upload failed.');
                };

                xhr.send(formData);
            });
        };
    }

    const editors = document.querySelectorAll('textarea.wysiwyg-editor');
    editors.forEach(function(el, index) {
        if (!el.id) {
            el.id = 'wysiwyg-editor-' + index;
        }
        const cfg = Object.assign({}, editorConfig, {
            selector: '#' + el.id,
            height: parseInt(el.getAttribute('data-wysiwyg-height') || '520', 10) || 520,
        });
        tinymce.init(cfg);
    });

    document.querySelectorAll('form').forEach(function(form) {
        form.addEventListener('submit', function() {
            if (typeof tinymce !== 'undefined' && tinymce.triggerSave) {
                tinymce.triggerSave();
            }
        });
    });
});
</script>
